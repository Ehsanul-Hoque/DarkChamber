[versions]
agp = "9.3.3"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-core = "1.19.1"
androidx-espresso = "3.7.0"
androidx-exifinterface = "1.4.2"
androidx-lifecycle = "2.11.0"
androidx-testExt = "1.3.0"
androidx-testRunner = "1.7.0"
composeMultiplatform = "1.12.2"
junit = "4.13.2"
kotlin = "2.4.21"
# The JetBrains material3 line has no stable release after 1.9.0; this is the version Compose Multiplatform
# 1.12.2 pairs with (its release notes' dependency list).
material3 = "1.12.0-alpha03"

# --- Phase 0+ target dependencies (docs/engineering/MODULES.md §6) ------------
# Declared now for the whole target architecture; most stay UNUSED until their
# consumer wires them in. No network/backend/analytics/crash coordinate appears here
# (ADR-004 / hard rule #3) — the catalog being the only dependency source is what
# keeps that enforceable.
cryptographyKotlin = "0.6.0"   # pinned EXACTLY (pre-1.0) — wrapped by CryptoEngine; do not bump casually
sqldelight = "2.4.1"
koin = "4.2.2"
decompose = "3.6.2"
coil3 = "3.6.3"
media3 = "1.11.1"
kermit = "2.2.0"
turbine = "1.2.1"
detekt = "1.23.8"
konsist = "0.18.1"
kover = "0.9.9"
buildkonfig = "0.24.1"
# core:crypto: .dchm streaming IO + CBOR header. JetBrains-official, KMP, GPLv3-OK.
kotlinxIo = "0.9.3"
kotlinxSerialization = "1.13.0"   # serialization runtime (cbor); the compiler plugin tracks `kotlin`
# core:db: reactive catalog Flow (sqldelight-coroutines) + host/iOS test drivers.
kotlinxCoroutines = "1.11.0"
# core:crypto: pure-JVM Argon2id for the Android/host passphrase-wrap actual. GPLv3-OK
# (BouncyCastle is MIT-style). iOS uses the vendored phc-winner-argon2 cinterop instead.
bouncycastle = "1.87"
# --- Session gate + biometric --------------------------------------
# androidx.biometric BASE (not -ktx: no stable -ktx exists; our BiometricAuthenticator
# seam already exposes suspend, so the -ktx coroutine helpers aren't needed). 1.1.0 is
# the stable line carrying BiometricPrompt + CryptoObject (crypto-bound auth). Apache-2.0.
androidxBiometric = "1.1.0"
# fragment-ktx — BiometricPrompt requires a FragmentActivity host (MainActivity). Apache-2.0.
androidxFragment = "1.9.1"
# Essenty lifecycle — the Decompose component-tree lifecycle. 2.7.1 matches decompose 3.6.2's
# transitive pin (move the two together); declared explicitly because :app drives a
# LifecycleRegistry directly. Apache-2.0.
essenty = "2.7.1"
# --- Camera --------------------------------------------------------
# CameraX, the Android side of :feature:camera's CameraController seam (implemented in :app's
# androidMain). 1.7.0 is the newest stable line; it raised its own minSdk to 24, which is ours.
# Apache-2.0. Photos are captured in memory only — never ImageCapture's file saver, which stages
# through a file. Video records to one app-private tmp/ file, deleted once it is encrypted
# (docs/THREAT_MODEL.md).
androidxCamera = "1.7.0"
# --- Text viewer ---------------------------------------------------
# JetBrains' CommonMark/GFM parser: text in, a syntax tree out — no UI, no I/O, no network, and only
# the Kotlin standard library underneath; JVM (what Android consumes) and both iOS targets. The viewer
# draws the tree with its own Compose code, so nothing here can open a link or fetch an image.
# Apache-2.0.
jetbrainsMarkdown = "0.7.18"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
# Reads the EXIF orientation tag so a portrait photo's preview is drawn upright. Apache-2.0. The
# alternative was owning an EXIF parser, which is not a thing this project wants to maintain.
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-testRunner" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }

# --- Phase 0+ target libraries (declared now, consumed later) -------
# Crypto — core:crypto is the ONLY module permitted to depend on these.
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptographyKotlin" }
cryptography-provider-optimal = { module = "dev.whyoleg.cryptography:cryptography-provider-optimal", version.ref = "cryptographyKotlin" }
# .dchm container (core:crypto): forward-only streaming source/sink + CBOR header framing. Local only.
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "kotlinxSerialization" }
# Test-only: parsing the committed .dchm format vectors (docs/format-test-vectors/).
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# Argon2id (core:crypto androidMain only) — the JVM-pure actual so its KATs run on the host.
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
# Persistence — core:db.
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-driver-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
# JVM host-test driver (JdbcSqliteDriver, IN_MEMORY) — no Robolectric/Context needed.
sqldelight-driver-sqlite = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
# Primitive column adapters (INTEGER AS kotlin.Int) — no hand-rolled adapters.
sqldelight-primitive-adapters = { module = "app.cash.sqldelight:primitive-adapters", version.ref = "sqldelight" }
# Coroutines — reactive catalog Flow (core:db) + test dispatchers. Local only, no network.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
# Android Main dispatcher — the session-gate components launch intents on Dispatchers.Main.
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# DI — feature :impl modules own their Koin module; app is the composition root.
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
# Navigation / component tree — the session gate lives here (ARCHITECTURE.md).
decompose = { module = "com.arkivanov.decompose:decompose", version.ref = "decompose" }
decompose-compose = { module = "com.arkivanov.decompose:extensions-compose", version.ref = "decompose" }
# Essenty lifecycle — the RootComponent LifecycleRegistry (:app), driven by the platform hosts.
essenty-lifecycle = { module = "com.arkivanov.essenty:lifecycle", version.ref = "essenty" }
# Biometric unlock — Android-only; the iOS side uses platform LocalAuthentication.
# core:crypto/:app androidMain present BiometricPrompt with a crypto-bound CryptoObject.
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidxBiometric" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
# The camera — Android-only; the iOS side uses AVFoundation directly. core = the use cases
# (Preview, ImageCapture), camera2 = the implementation behind them, lifecycle = binding to the
# activity, view = PreviewView for the viewfinder, video = VideoCapture and its Recorder (already on
# the classpath through camera-view; declared because :app now calls it directly).
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidxCamera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidxCamera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidxCamera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidxCamera" }
androidx-camera-video = { module = "androidx.camera:camera-video", version.ref = "androidxCamera" }
# Image loading — encrypted custom Fetcher, memory cache only.
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
# Media playback — Android decrypting DataSource (chunk range mapping).
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
# Markdown parsing — the text viewer's formatted view; drawn by our own code.
jetbrains-markdown = { module = "org.jetbrains:markdown", version.ref = "jetbrainsMarkdown" }
# Logging — core:logging (Kermit; no Crashlytics/remote anything, ever).
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
# Test-only.
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# :konsist is a plain JVM test-only module (the architecture rules run as JUnit tests).
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# --- Phase 0+ target plugins (declared now, applied later) ----------
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
buildkonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildkonfig" }