# .github/workflows/pr.yml
#
# Runs on every PR to main. Fast checks on Linux; the expensive macOS iOS job — which runs the iOS
# unit tests, not just a compile — is gated to run only when shared/iOS code changes.
#
# SCOPE: builds the modules, validates commits + deps, and enforces the SECURITY-INVARIANT
# architecture rules (:konsist — cipher confinement, no network, no telemetry SDK, shared-storage
# confinement, logger confinement). Those run in the `build` job because they guard the hard rules
# in CLAUDE.md and must gate every PR.
# The `quality` job (ktlint / detekt / kover) stays COMMENTED OUT until those convention plugins
# exist (docs/engineering/MODULES.md §5). `migrationTest` arrives after v1.0 ships fixture vaults and
# is carried as a commented step in the iOS job so the first release has a prompt.
# Do NOT mark any check required in branch protection until the quality job is green — see
# nightly/release/test-build which remain *.yml.disabled.
name: PR

on:
  pull_request:
    branches: [main]
    # `ready_for_review` is NOT in the default type set (opened, synchronize, reopened), so without
    # it marking a draft PR ready fires no event at all — and the `ios-compile` job, which is gated
    # on `draft == false`, stays skipped from the draft's last run with nothing to re-evaluate it.
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs on the same PR.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect whether shared/iOS code changed, to gate the macOS job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'core/**'                    # KMP code (docs/engineering/MODULES.md)
              - 'feature/**'
              # :app is shared KMP code too — the composition root and the session gate — and it
              # carries 100 of the iOS tests. Without this line a change confined to its commonMain
              # skips the whole iOS job: `**/iosMain/**` below only catches its platform half, and
              # `core/**` does not reach it. The session-gate fix in this cycle was exactly such a
              # change, with those 100 tests covering it.
              - 'app/**'
              - '**/iosMain/**'
              - 'iosApp/**'
              - 'build-logic/**'
              - 'gradle/libs.versions.toml'

  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the checker walks the full PR commit range
      - name: Validate commit messages (all commits in the PR)
        # Node-free Conventional Commits check (docs/engineering/WORKFLOW.md §2).
        run: bash ./scripts/check-commits.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  # Supply-chain gate: flags new dependencies & incompatible licenses on the PR
  # (docs/engineering/RELEASE.md §6). New runtime deps need justification in the PR body.
  #
  # The Dependency Review API needs Advanced Security on a PRIVATE repo, so this skips while the
  # repo is private and starts running by itself the moment it goes public — no edit needed at
  # release time. The project's real supply-chain gate is Gradle dependency verification
  # (gradle/verification-metadata.xml): checksums, enforced locally and offline.
  dependency-review:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Compiles the modules, enforces the security-invariant architecture rules, and runs the
  # JVM/Android host unit tests across modules.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Security architecture rules (Konsist)
        # Runs first: it is seconds of work and a violation of a hard security rule should fail
        # the PR before we spend minutes assembling. Own step so the failure is attributable.
        run: ./gradlew :konsist:test

      - name: Assemble Android (foss debug) + host unit tests
        # assembleFossDebug builds :androidApp (+ its :core:model dep); testAndroidHostTest
        # runs the common/Android-host unit tests in every core module.
        run: ./gradlew :androidApp:assembleFossDebug testAndroidHostTest

  # --- Deferred: the quality gate. Uncomment once the darkchamber.quality convention plugin adds
  #     these tasks (MODULES.md §5, TESTING.md §5). Konsist is NOT here — the security-invariant
  #     rules already run in the `build` job above, where they gate every PR.
  # quality:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-java@v4
  #       with:
  #         distribution: temurin
  #         java-version: "21"
  #     - uses: gradle/actions/setup-gradle@v4
  #     - name: Static analysis (ktlint, detekt)
  #       run: ./gradlew ktlintCheck detekt
  #     - name: Coverage gates
  #       run: ./gradlew koverVerify

  # NOTE: this job was called `ios-compile` until it started running the tests. The job name is the
  # check name, so renaming it retires the old check — which is only safe while nothing requires it.
  # Branch protection must not be pointed at a check name before that name is the one reporting.
  ios-tests:
    needs: changes
    # Gated twice: only when shared/iOS code changed, and only once the PR is marked ready.
    # macOS minutes bill at 10x, so a draft PR keeps the fast Linux signal on every push while
    # the expensive job waits for the end of the cycle. (Moot once the repo is public.)
    if: needs.changes.outputs.ios == 'true' && github.event.pull_request.draft == false
    runs-on: macos-latest        # ~10x the cost of Linux — that's why it's gated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: iOS unit tests (simulator) + device-architecture compile
        # The simulator test task runs the suite on a booted simulator, which `macos-latest` provides
        # via its bundled Xcode. This is what the host suite cannot reach: the iOS platform seams, the
        # whole common suite against the **native** SQLite driver rather than the JDBC one, and the
        # .dchm format vectors on a second platform. 697 tests as of this change.
        #
        # No separate compile tasks for the simulator: the test task compiles and links its own
        # sources, so `compileKotlinIosSimulatorArm64` and `compileTestKotlinIosSimulatorArm64` were
        # redundant once it runs. The **device** architecture is still compiled explicitly — nothing
        # else here builds for arm64 hardware, and that is the one the App Store receives.
        run: ./gradlew compileKotlinIosArm64 iosSimulatorArm64Test

      # - name: Migration gate (old vaults always open)
      #   run: ./gradlew migrationTest
      #   # Enable once the first release has shipped a fixture vault to upgrade *from*
      #   # (docs/engineering/TESTING.md §3.2). Carried here as a reminder because the task does not
      #   # exist yet and nothing else will prompt anyone at the first release.
